
name: Daily Bible Shorts Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm daily run
        run: |
          echo "Bible Shorts workflow started"
          echo "Target publishing time: 07:00 Asia/Kolkata"

