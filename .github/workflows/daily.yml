
name: Daily Bible Shorts Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate Bible Short
        run: python create_video.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: bible-short-video
          path: |
            bible_short.mp4
            poster.jpg
          if-no-files-found: error
          retention-days: 7
